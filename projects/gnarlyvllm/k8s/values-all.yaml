    task: generate
    port: 8012
    gpu_memory_utilization: 0.9
    max_model_len: 8192
    reasoning_parser: qwen3
    language_model_only: true
    speculative_config: '{"method": "mtp", "num_speculative_tokens": 1}'
    override_generation_config:
      temperature: 0.6
      top_p: 0.95
      top_k: 20
      min_p: 0.0
      presence_penalty: 0.0
      repetition_penalty: 1.0

  ingest-qwen3.5-9b:
