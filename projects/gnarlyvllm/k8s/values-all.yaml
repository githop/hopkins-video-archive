proxy:
  hostname: "0.0.0.0"
  logging:
    enabled: true
    capture_bodies: true
    skip_paths:
      - /health
      - /v1/models

models:
  chat-qwen3-4b:
    repo: Qwen/Qwen3-4B-AWQ
    task: generate
    port: 8001
    max_model_len: 32768
    gpu_memory_utilization: 0.9

  embed-qwen3-4b:
    repo: Qwen/Qwen3-Embedding-4B
    task: embed
    port: 8002
    max_model_len: 32768
    gpu_memory_utilization: 0.9

  embed-qwen3-0.6b:
    repo: Qwen/Qwen3-Embedding-0.6B
    task: embed
    port: 8005
    max_model_len: 32768
    gpu_memory_utilization: 0.9

  ingest-qwen3-4b:
    repo: Qwen/Qwen3-4B-AWQ
    task: generate
    port: 8003
    gpu_memory_utilization: 0.95
    max_model_len: 8192
    max_num_seqs: 32
    reasoning_parser: qwen3

  ingest-qwen3-14b:
    repo: Qwen/Qwen3-14B-AWQ
    task: generate
    port: 8006
    gpu_memory_utilization: 0.9
    max_model_len: 8192
    reasoning_parser: deepseek_r1
    max_num_seqs: 16
    enforce_eager: true

  rerank-qwen3-4b:
    repo: Qwen/Qwen3-Reranker-4B
    task: score
    port: 8004
    gpu_memory_utilization: 0.9
    max_model_len: 4096
    chat_template: qwen3-reranker-chat-template.jinja
    hf_overrides: '{"architectures": ["Qwen3ForSequenceClassification"], "classifier_from_token": ["no", "yes"], "is_original_qwen3_reranker": true}'

  chat-qwen3-8b:
    repo: Qwen/Qwen3-8B-AWQ
