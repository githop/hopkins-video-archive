proxy:
  hostname: "0.0.0.0"
  logging:
    enabled: true
    capture_bodies: true
    skip_paths:
      - /health
      - /v1/models

models:
  chat-qwen3-4b:
    repo: Qwen/Qwen3-4B-AWQ
    task: generate
    port: 8001
    gpu_memory_utilization: 0.38
    max_model_len: 8192
    reasoning_parser: qwen3
    enforce_eager: true

  embed-qwen3-0.6b:
    repo: Qwen/Qwen3-Embedding-0.6B
    task: embed
    port: 8005
    gpu_memory_utilization: 0.1
    max_model_len: 4096
    enforce_eager: true

  rerank-qwen3-4b:
    repo: Qwen/Qwen3-Reranker-4B
    task: score
    port: 8004
    gpu_memory_utilization: 0.38
    max_model_len: 4096
    enforce_eager: true
    hf_overrides: '{"architectures": ["Qwen3ForSequenceClassification"], "classifier_from_token": ["no", "yes"], "is_original_qwen3_reranker": true}'
