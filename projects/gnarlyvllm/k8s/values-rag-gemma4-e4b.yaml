proxy:
  hostname: "0.0.0.0"
  logging:
    enabled: true
    capture_bodies: true
    skip_paths:
      - /health
      - /v1/models

models:
  chat-gemma4-e4b:
    repo: ciocan/gemma-4-E4B-it-W4A16
    task: generate
    port: 8017
    gpu_memory_utilization: 0.65
    max_model_len: 8192
    enforce_eager: true
    reasoning_parser: gemma4
    quantization: gptq
    performance_mode: interactivity
    default_chat_template_kwargs: '{"enable_thinking": true}'

  embed-qwen3-0.6b:
    repo: Qwen/Qwen3-Embedding-0.6B
    task: embed
    port: 8005
    gpu_memory_utilization: 0.1
    max_model_len: 4096
    enforce_eager: true

  rerank-qwen3-0.6b:
    repo: Qwen/Qwen3-Reranker-0.6B
    task: score
    port: 8007
    gpu_memory_utilization: 0.15
    max_model_len: 4096
    enforce_eager: true
    chat_template: qwen3-reranker-chat-template.jinja
    hf_overrides: '{"architectures": ["Qwen3ForSequenceClassification"], "classifier_from_token": ["no", "yes"], "is_original_qwen3_reranker": true}'
