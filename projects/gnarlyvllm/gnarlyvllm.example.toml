# gnarlyvllm.toml - Configuration for gnarlyvllm
# Copy this file to gnarlyvllm.toml and customize for your setup

[settings]
# Port for the Gnarly Proxy (unified OpenAI-compatible endpoint)
litellm_port = 4000

# HuggingFace cache directory (models are downloaded here)
huggingface_cache = "~/.cache/huggingface"

# Proxy server binding - '0.0.0.0' allows network access from other machines
# Use '127.0.0.1' to restrict to localhost only (more secure for single-machine use)
# proxy_hostname = "0.0.0.0"

# Proxy request logging (SQLite-based)
# Enable to log all requests/responses to a local SQLite database
# Access the dashboard at http://<vm-ip>:4000/admin when enabled
# proxy_log_enabled = false
# proxy_log_db_path = "~/.local/share/gnarlyvllm/proxy-logs.db"
# proxy_log_capture_bodies = true  # Log full request/response bodies
# proxy_log_skip_paths = ["/health", "/v1/models"]  # Don't log these paths

# Model definitions
# Each model has a unique name and configuration

[models.chat-qwen-7b]
repo = "Qwen/Qwen2.5-7B-Instruct-AWQ"
task = "generate"
port = 8000

[models.chat-qwen-7b.defaults]
gpu_memory_utilization = 0.5
max_model_len = 32768
performance_mode = "interactivity"  # balanced, interactivity, or throughput
kv_cache_dtype = "fp8"  # auto, fp16, bf16, fp8, fp8_e4m3, fp8_e5m2
enable_prefix_caching = true
cpu_offload_gb = 5  # Space in GiB to offload to CPU, per GPU
kv_offloading_size = 2  # Size of the KV cache offloading buffer in GiB
kv_offloading_backend = "native"  # Backend for KV offloading (lmcache, native)
enable_tool_calling = true  # Enables --enable-auto-tool-choice --tool-call-parser hermes
reasoning_parser = "qwen3"  # Enables --reasoning-parser qwen3
override_generation_config = { temperature = 1.0, top_p = 0.95, top_k = 20, min_p = 0.0, presence_penalty = 1.5, repetition_penalty = 1.0 } # Thinking mode for general tasks

[models.embed-bge-m3]
repo = "BAAI/bge-m3"
task = "embed"
port = 8001

[models.embed-bge-m3.defaults]
gpu_memory_utilization = 0.15

[models.rerank-bge]
repo = "BAAI/bge-reranker-v2-m3"
task = "score"
port = 8002

[models.rerank-bge.defaults]
gpu_memory_utilization = 0.15

# Stacks - named groups of models to run together
# Each stack can override model defaults for memory-constrained scenarios

[stacks.rag-qwen-7b]
description = "RAG stack for whisper transcriptions"
models = ["chat-qwen-7b", "embed-bge-m3", "rerank-bge"]

# Override model settings when running in this stack
[stacks.rag-qwen-7b.overrides.chat-qwen-7b]
gpu_memory_utilization = 0.4
max_model_len = 16384

[stacks.rag-qwen-7b.overrides.embed-bge-m3]
gpu_memory_utilization = 0.1

[stacks.chat-only]
description = "Full resources for chat model only"
models = ["chat-qwen-7b"]
# No overrides - uses model defaults (0.5, 32k context)
