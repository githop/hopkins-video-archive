[settings]
litellm_port = 4000
huggingface_cache = "~/.cache/huggingface"

[models.chat-qwen3-4b]
repo = "Qwen/Qwen3-4B-AWQ"
task = "generate"
port = 8001

[models.chat-qwen3-4b.defaults]
max_model_len = 32768
gpu_memory_utilization = 0.9

[models.embed-qwen3-4b]
repo = "Qwen/Qwen3-Embedding-4B"
task = 'embed'
port = 8002

[models.embed-qwen3-4b.defaults]
max_model_len = 32768
gpu_memory_utilization = 0.9


[models."embed-qwen3-0.6b"]
repo = "Qwen/Qwen3-Embedding-0.6B"
task = 'embed'
port = 8005

[models."embed-qwen3-0.6b".defaults]
max_model_len = 32768
gpu_memory_utilization = 0.9

[models.ingest-qwen3-4b]
repo = "Qwen/Qwen3-4B-AWQ"
task = "generate"
port = 8003 

[models.ingest-qwen3-4b.defaults]
gpu_memory_utilization = 0.95
max_model_len = 8192
max_num_seqs = 32           # High concurrency support
reasoning_parser = "qwen3"

[models.ingest-qwen3-14b]
repo = "Qwen/Qwen3-14B-AWQ"
task = "generate"
port = 8006

[models.ingest-qwen3-14b.defaults]
gpu_memory_utilization = 0.9
max_model_len = 8192               # Good context length for batches
enable_reasoning = true
reasoning_parser = "deepseek_r1" 
max_num_seqs = 16                  # Higher concurrency than 32B model
enforce_eager = true               # Avoid CUDA graph overhead for varying lengths

[models.rerank-qwen3-4b]
repo = "Qwen/Qwen3-Reranker-4B"
task = "score"
port = 8004

[models.rerank-qwen3-4b.defaults]
gpu_memory_utilization = 0.9
max_model_len = 4096
hf_overrides = '{"architectures": ["Qwen3ForSequenceClassification"], "classifier_from_token": ["no", "yes"], "is_original_qwen3_reranker": true}'

[models.chat-qwen3-8b]
repo = "Qwen/Qwen3-8B-AWQ"
task = "generate"
port = 8009

[models.chat-qwen3-8b.defaults]
gpu_memory_utilization = 0.9
max_model_len = 8192
reasoning_parser = "deepseek_r1"

[models."chat-qwen3.5-9b"]
repo = "QuantTrio/Qwen3.5-9B-AWQ"
task = "generate"
port = 8012

[models."chat-qwen3.5-9b".defaults]
gpu_memory_utilization = 0.9
max_model_len = 8192
reasoning_parser = "qwen3"
language_model_only = true
speculative_config = '{"method": "mtp", "num_speculative_tokens": 1}'
override_generation_config = { 
  temperature = 0.6, 
  top_p = 0.95, 
  top_k = 20,
  min_p = 0.0, 
  presence_penalty = 0.0, 
  repetition_penalty = 1.0 
  }

[models."ingest-qwen3.5-9b"]
repo = "QuantTrio/Qwen3.5-9B-AWQ"
task = "generate"
port = 8014

[models."ingest-qwen3.5-9b".defaults]
gpu_memory_utilization = 0.9
max_model_len = 16384
max_num_seqs = 12
reasoning_parser = "qwen3"
language_model_only = true
enable_prefix_caching = true
override_generation_config = { 
  temperature = 0.6, 
  top_p = 0.95, 
  top_k = 20,
  min_p = 0.0, 
  presence_penalty = 0.0, 
  repetition_penalty = 1.0 
  }

[models."rerank-qwen3-0.6b"]
repo = "Qwen/Qwen3-Reranker-0.6B"
task = "score"
port = 8007

[models."rerank-qwen3-0.6b".defaults]
gpu_memory_utilization = 0.15
max_model_len = 4096
hf_overrides = '{"architectures": ["Qwen3ForSequenceClassification"], "classifier_from_token": ["no", "yes"], "is_original_qwen3_reranker": true}'

[models."ingest-glm4.7-flash"]
repo = "cyankiwi/GLM-4.7-Flash-AWQ-4bit"
task = "generate"
port = 8008
image = "gnarlyvllm/glm-compat:latest"

[models."ingest-glm4.7-flash".defaults]
gpu_memory_utilization = 0.9
max_model_len = 8192
# reasoning_parser = "glm45"
max_num_seqs = 16
enforce_eager = true

[models.ingest-qwen3-30b]
repo = "QuantTrio/Qwen3-30B-A3B-Thinking-2507-AWQ"
task = "generate"
port = 8010

[models.ingest-qwen3-30b.defaults]
gpu_memory_utilization = 0.9
max_model_len = 16384
max_num_seqs = 6
enable_expert_parallel = true
reasoning_parser = "deepseek_r1"


[stacks.rag-qwen3-4b]
description = "Summarizer-based RAG stack with Embedding and Reranking"
models = ["chat-qwen3-4b", "embed-qwen3-0.6b", "rerank-qwen3-4b"]

[stacks.rag-qwen3-4b.overrides.chat-qwen3-4b]
gpu_memory_utilization = 0.38
max_model_len = 8192
reasoning_parser = "qwen3"
enforce_eager = true

[stacks.rag-qwen3-4b.overrides."embed-qwen3-0.6b"]
gpu_memory_utilization = 0.1
max_model_len = 4096
enforce_eager = true

[stacks.rag-qwen3-4b.overrides.rerank-qwen3-4b]
gpu_memory_utilization = 0.38
max_model_len = 4096
enforce_eager = true

[stacks.rag-qwen3-8b]
description = "8B Summarizer with 0.6B Reranker for better tool calling and reasoning"
models = ["chat-qwen3-8b", "embed-qwen3-0.6b", "rerank-qwen3-0.6b"]

[stacks.rag-qwen3-8b.overrides.chat-qwen3-8b]
gpu_memory_utilization = 0.55
max_model_len = 8192
reasoning_parser = "deepseek_r1"
enforce_eager = true

[stacks.rag-qwen3-8b.overrides."embed-qwen3-0.6b"]
gpu_memory_utilization = 0.1
max_model_len = 4096
enforce_eager = true

[stacks.rag-qwen3-8b.overrides."rerank-qwen3-0.6b"]
gpu_memory_utilization = 0.15
max_model_len = 4096
enforce_eager = true

[stacks."rag-qwen3.5-9b"]
description = "9B Summarizer (Qwen 3.5) with 0.6B Reranker"
models = ["chat-qwen3.5-9b", "embed-qwen3-0.6b", "rerank-qwen3-0.6b"]

[stacks."rag-qwen3.5-9b".overrides."chat-qwen3.5-9b"]
gpu_memory_utilization = 0.68
max_model_len = 8192
reasoning_parser = "qwen3"
enforce_eager = true
language_model_only = true
performance_mode = "interactivity"

[stacks."rag-qwen3.5-9b".overrides."embed-qwen3-0.6b"]
gpu_memory_utilization = 0.1
max_model_len = 4096
enforce_eager = true

[stacks."rag-qwen3.5-9b".overrides."rerank-qwen3-0.6b"]
gpu_memory_utilization = 0.15
max_model_len = 4096
enforce_eager = true

[models."ingest-qwen3.5-27b"]
repo = "Qwen/Qwen3.5-27B-GPTQ-Int4"
task = "generate"
port = 8011

[models."ingest-qwen3.5-27b".defaults]
gpu_memory_utilization = 0.85
max_model_len = 4096
quantization = "gptq_marlin"
enforce_eager = true
reasoning_parser = "qwen3"
max_num_seqs = 4

[models."chat-qwen3.5-4b"]
repo = "QuantTrio/Qwen3.5-4B-AWQ"
task = "generate"
port = 8013

[models."chat-qwen3.5-4b".defaults]
gpu_memory_utilization = 0.9
max_model_len = 8192
enforce_eager = true
language_model_only = true
reasoning_parser = "qwen3"
default_chat_template_kwargs = '{"enable_thinking": false}'
speculative_config = '{"method": "mtp", "num_speculative_tokens": 2}'

[stacks."rag-qwen3.5-4b"]
description = "4B Summarizer (Qwen 3.5) with 0.6B Reranker"
models = ["chat-qwen3.5-4b", "embed-qwen3-0.6b", "rerank-qwen3-0.6b"]

[stacks."rag-qwen3.5-4b".overrides."chat-qwen3.5-4b"]
gpu_memory_utilization = 0.68
performance_mode = "interactivity"
kv_cache_dtype = "fp8"

[stacks."rag-qwen3.5-4b".overrides."embed-qwen3-0.6b"]
gpu_memory_utilization = 0.1
max_model_len = 4096
enforce_eager = true

[stacks."rag-qwen3.5-4b".overrides."rerank-qwen3-0.6b"]
gpu_memory_utilization = 0.15
max_model_len = 4096
enforce_eager = true

[models.chat-gemma4-e4b]
repo = "google/gemma-4-E4B-it"
task = "generate"
port = 8015
image = "gnarlyvllm/gemma4-compat:latest"

[models.chat-gemma4-e4b.defaults]
gpu_memory_utilization = 0.9
max_model_len = 8192
enforce_eager = true
language_model_only = true
reasoning_parser = "gemma4"

[stacks.rag-gemma4-e4b]
description = "Gemma 4 E4B Summarizer with 0.6B Embedding and Reranker"
models = ["chat-gemma4-e4b", "embed-qwen3-0.6b", "rerank-qwen3-0.6b"]

[stacks.rag-gemma4-e4b.overrides.chat-gemma4-e4b]
gpu_memory_utilization = 0.75
max_model_len = 8192
enforce_eager = true
performance_mode = "interactivity"

[stacks.rag-gemma4-e4b.overrides."embed-qwen3-0.6b"]
gpu_memory_utilization = 0.12
max_model_len = 4096
enforce_eager = true

[stacks.rag-gemma4-e4b.overrides."rerank-qwen3-0.6b"]
gpu_memory_utilization = 0.08
max_model_len = 4096
enforce_eager = true

[models."ingest-gemma4-31b"]
repo = "Intel/gemma-4-31B-it-int4-AutoRound"
task = "generate"
port = 8016
image = "gnarlyvllm/gemma4-compat:latest"

[models."ingest-gemma4-31b".defaults]
gpu_memory_utilization = 0.95
max_model_len = 4096
max_num_seqs = 4
enforce_eager = true
reasoning_parser = "gemma4"
enable_reasoning = true
enable_prefix_caching = true
quantization = "inc"
