[settings]
litellm_port = 4000
huggingface_cache = "~/.cache/huggingface"

[models.summarizer]
repo = "Qwen/Qwen3-4B-AWQ"
task = "generate"
port = 8001

[models.summarizer.defaults]
max_model_len = 32768
gpu_memory_utilization = 0.9

[models.embed]
repo = "Qwen/Qwen3-Embedding-4B"
task = 'embed'
port = 8002

[models.embed.defaults]
max_model_len = 32768
gpu_memory_utilization = 0.9


[models.embed-small]
repo = "Qwen/Qwen3-Embedding-0.6B"
task = 'embed'
port = 8005

[models.embed-small.defaults]
max_model_len = 32768
gpu_memory_utilization = 0.9

[models.summarizer-bulk]
repo = "Qwen/Qwen3-4B-AWQ"
task = "generate"
port = 8003 

[models.summarizer-bulk.defaults]
gpu_memory_utilization = 0.95
max_model_len = 8192
max_num_seqs = 32           # High concurrency support
reasoning_parser = "qwen3"

[models.summarizer-bulk-14b]
repo = "Qwen/Qwen3-14B-AWQ"
task = "generate"
port = 8006

[models.summarizer-bulk-14b.defaults]
gpu_memory_utilization = 0.9
max_model_len = 8192               # Good context length for batches
enable_reasoning = true
reasoning_parser = "deepseek_r1" 
max_num_seqs = 16                  # Higher concurrency than 32B model
enforce_eager = true               # Avoid CUDA graph overhead for varying lengths

[models.rerank]
repo = "Qwen/Qwen3-Reranker-4B"
task = "score"
port = 8004

[models.rerank.defaults]
gpu_memory_utilization = 0.9
max_model_len = 4096
hf_overrides = '{"architectures": ["Qwen3ForSequenceClassification"], "classifier_from_token": ["no", "yes"], "is_original_qwen3_reranker": true}'

[models.summarizer-8b]
repo = "Qwen/Qwen3-8B-AWQ"
task = "generate"
port = 8009

[models.summarizer-8b.defaults]
gpu_memory_utilization = 0.9
max_model_len = 8192
reasoning_parser = "deepseek_r1"

[models.summarizer-9b]
repo = "QuantTrio/Qwen3.5-9B-AWQ"
task = "generate"
port = 8012

[models.summarizer-9b.defaults]
gpu_memory_utilization = 0.9
max_model_len = 8192
reasoning_parser = "qwen3"
language_model_only = true
speculative_config = '{"method": "mtp", "num_speculative_tokens": 1}'
override_generation_config = { 
  temperature = 0.6, 
  top_p = 0.95, 
  top_k = 20,
  min_p = 0.0, 
  presence_penalty = 0.0, 
  repetition_penalty = 1.0 
  }

[models.summarizer-bulk-9b]
repo = "QuantTrio/Qwen3.5-9B-AWQ"
task = "generate"
port = 8014

[models.summarizer-bulk-9b.defaults]
gpu_memory_utilization = 0.9
max_model_len = 16384
max_num_seqs = 12
reasoning_parser = "qwen3"
language_model_only = true
enable_prefix_caching = true
override_generation_config = { 
  temperature = 0.6, 
  top_p = 0.95, 
  top_k = 20,
  min_p = 0.0, 
  presence_penalty = 0.0, 
  repetition_penalty = 1.0 
  }

[models.rerank-small]
repo = "Qwen/Qwen3-Reranker-0.6B"
task = "score"
port = 8007

[models.rerank-small.defaults]
gpu_memory_utilization = 0.15
max_model_len = 4096
hf_overrides = '{"architectures": ["Qwen3ForSequenceClassification"], "classifier_from_token": ["no", "yes"], "is_original_qwen3_reranker": true}'

[models.summarizer-bulk-glm-flash]
repo = "cyankiwi/GLM-4.7-Flash-AWQ-4bit"
task = "generate"
port = 8008
image = "gnarlyvllm/glm-compat:latest"

[models.summarizer-bulk-glm-flash.defaults]
gpu_memory_utilization = 0.9
max_model_len = 8192
# reasoning_parser = "glm45"
max_num_seqs = 16
enforce_eager = true

[models.summarizer-bulk-30b]
repo = "QuantTrio/Qwen3-30B-A3B-Thinking-2507-AWQ"
task = "generate"
port = 8010

[models.summarizer-bulk-30b.defaults]
gpu_memory_utilization = 0.9
max_model_len = 16384
max_num_seqs = 6
enable_expert_parallel = true
reasoning_parser = "deepseek_r1"

[stacks.rag]
description = "Chat and Embedding stack for RAG"
models = ["summarizer", "embed"]

[stacks.rag.overrides.summarizer]
gpu_memory_utilization = 0.45
max_model_len = 8192
enable_tool_calling = true
tool_call_parser = "qwen3"
reasoning_parser = "qwen3"
enforce_eager = true

[stacks.rag.overrides.embed]
gpu_memory_utilization = 0.45
max_model_len = 4096
enforce_eager = true

[stacks.rag-full]
description = "Summarizer-based RAG stack with Embedding and Reranking"
models = ["summarizer", "embed-small", "rerank"]

[stacks.rag-full.overrides.summarizer]
gpu_memory_utilization = 0.38
max_model_len = 8192
reasoning_parser = "qwen3"
enforce_eager = true

[stacks.rag-full.overrides.embed-small]
gpu_memory_utilization = 0.1
max_model_len = 4096
enforce_eager = true

[stacks.rag-full.overrides.rerank]
gpu_memory_utilization = 0.38
max_model_len = 4096
enforce_eager = true

[stacks.rag-full-8b]
description = "8B Summarizer with 0.6B Reranker for better tool calling and reasoning"
models = ["summarizer-8b", "embed-small", "rerank-small"]

[stacks.rag-full-8b.overrides.summarizer-8b]
gpu_memory_utilization = 0.55
max_model_len = 8192
reasoning_parser = "deepseek_r1"
enforce_eager = true

[stacks.rag-full-8b.overrides.embed-small]
gpu_memory_utilization = 0.1
max_model_len = 4096
enforce_eager = true

[stacks.rag-full-8b.overrides.rerank-small]
gpu_memory_utilization = 0.15
max_model_len = 4096
enforce_eager = true

[stacks.rag-full-9b]
description = "9B Summarizer (Qwen 3.5) with 0.6B Reranker"
models = ["summarizer-9b", "embed-small", "rerank-small"]

[stacks.rag-full-9b.overrides.summarizer-9b]
gpu_memory_utilization = 0.68
max_model_len = 8192
reasoning_parser = "qwen3"
enforce_eager = true
language_model_only = true
performance_mode = "interactivity"

[stacks.rag-full-9b.overrides.embed-small]
gpu_memory_utilization = 0.1
max_model_len = 4096
enforce_eager = true

[stacks.rag-full-9b.overrides.rerank-small]
gpu_memory_utilization = 0.15
max_model_len = 4096
enforce_eager = true

[models.summarizer-bulk-27b]
repo = "Qwen/Qwen3.5-27B-GPTQ-Int4"
task = "generate"
port = 8011

[models.summarizer-bulk-27b.defaults]
gpu_memory_utilization = 0.85
max_model_len = 4096
quantization = "gptq_marlin"
enforce_eager = true
reasoning_parser = "qwen3"
max_num_seqs = 4

[models.summarizer-4b]
repo = "QuantTrio/Qwen3.5-4B-AWQ"
task = "generate"
port = 8013

[models.summarizer-4b.defaults]
gpu_memory_utilization = 0.9
max_model_len = 8192
enforce_eager = true
language_model_only = true
reasoning_parser = "qwen3"
default_chat_template_kwargs = '{"enable_thinking": false}'
speculative_config = '{"method": "mtp", "num_speculative_tokens": 2}'

[stacks.rag-full-4b]
description = "4B Summarizer (Qwen 3.5) with 0.6B Reranker"
models = ["summarizer-4b", "embed-small", "rerank-small"]

[stacks.rag-full-4b.overrides.summarizer-4b]
gpu_memory_utilization = 0.68
performance_mode = "interactivity"
kv_cache_dtype = "fp8"

[stacks.rag-full-4b.overrides.embed-small]
gpu_memory_utilization = 0.1
max_model_len = 4096
enforce_eager = true

[stacks.rag-full-4b.overrides.rerank-small]
gpu_memory_utilization = 0.15
max_model_len = 4096
enforce_eager = true
